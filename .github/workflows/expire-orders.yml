name: Expirar pedidos vencidos

# Chama periodicamente a rota que expira pedidos Pix e cartão vencidos
# (libera estoque reservado) — reforço ao "verificação ao acessar" feito
# em getOrderForViewing. Alternativa gratuita e portátil a um Netlify
# Scheduled Function / Cloudflare Cron Trigger.
#
# Configure os secrets do repositório antes de habilitar:
#   SITE_URL    -> ex. https://chrysstore.com.br
#   CRON_SECRET -> mesmo valor da variável de ambiente CRON_SECRET do deploy

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  expire-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/expire-orders
        run: |
          curl -sS -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/expire-orders"
